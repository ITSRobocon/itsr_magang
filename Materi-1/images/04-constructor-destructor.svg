<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <rect width="820" height="330" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Siklus hidup object</text>
  <line x1="40" y1="130" x2="780" y2="130" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <text x="780" y="118" text-anchor="end" font-size="13" fill="#64748b">waktu</text>
  <!-- steps -->
  <circle cx="130" cy="130" r="14" fill="#16a34a"/>
  <circle cx="410" cy="130" r="14" fill="#2563eb"/>
  <circle cx="690" cy="130" r="14" fill="#dc2626"/>
  <g text-anchor="middle">
    <text x="130" y="80" font-size="16" font-weight="bold" fill="#166534">1. Object dibuat</text>
    <text x="130" y="100" font-size="13" fill="#475569">Mahasiswa mhs;</text>
    <text x="410" y="80" font-size="16" font-weight="bold" fill="#1e40af">2. Object dipakai</text>
    <text x="410" y="100" font-size="13" fill="#475569">cout &lt;&lt; "Semangat!";</text>
    <text x="690" y="80" font-size="16" font-weight="bold" fill="#991b1b">3. Object dihancurkan</text>
    <text x="690" y="100" font-size="13" fill="#475569">akhir main()</text></g>
  <g text-anchor="middle">
    <rect x="40" y="165" width="180" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="130" y="190" font-size="14" font-weight="bold" fill="#166534">Constructor jalan</text>
    <text x="130" y="210" font-size="13" font-family="monospace" fill="#14532d">Mahasiswa()</text>
    <rect x="320" y="165" width="180" height="60" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="410" y="190" font-size="14" font-weight="bold" fill="#1e40af">Method / kode lain</text>
    <text x="410" y="210" font-size="13" fill="#1e3a8a">object aktif</text>
    <rect x="600" y="165" width="180" height="60" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="690" y="190" font-size="14" font-weight="bold" fill="#991b1b">Destructor jalan</text>
    <text x="690" y="210" font-size="13" font-family="monospace" fill="#7f1d1d">~Mahasiswa()</text></g>
  <rect x="40" y="255" width="740" height="50" rx="8" fill="#0f172a"/>
  <g font-size="14" font-family="monospace" fill="#e2e8f0">
    <text x="60" y="285">Output:</text>
    <text x="130" y="285" fill="#86efac">Hallo!</text>
    <text x="360" y="285" fill="#93c5fd">Semangat!</text>
    <text x="620" y="285" fill="#fca5a5">Sampai jumpa!</text></g>
</svg>
