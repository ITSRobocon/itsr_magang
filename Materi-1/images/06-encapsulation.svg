<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <rect width="820" height="360" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Encapsulation: data dilindungi, akses lewat pintu (method)</text>
  <!-- outside -->
  <rect x="30" y="100" width="170" height="150" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="115" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">main()</text>
  <g font-size="13" font-family="monospace" fill="#1e293b">
    <text x="45" y="165">setGaji(10000000)</text>
    <text x="45" y="195">setGaji(-500)</text>
    <text x="45" y="225">getGaji()</text></g>
  <!-- class -->
  <rect x="280" y="60" width="510" height="260" rx="12" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2.5"/>
  <text x="535" y="86" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e3a8a">class Pekerja</text>
  <!-- public door -->
  <rect x="300" y="105" width="200" height="195" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="400" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">public (pintu masuk)</text>
  <g font-size="13" font-family="monospace" fill="#14532d">
    <text x="312" y="160">void setGaji(int g) {</text>
    <text x="312" y="180">  if (g &gt;= 0) gaji = g;</text>
    <text x="312" y="200">  else cout &lt;&lt; "Tidak boleh!";</text>
    <text x="312" y="220">}</text>
    <text x="312" y="255">int getGaji() {</text>
    <text x="312" y="275">  return gaji;  }</text></g>
  <!-- private data -->
  <rect x="560" y="105" width="210" height="195" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="665" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">private (terlindungi)</text>
  <rect x="595" y="170" width="140" height="60" rx="8" fill="#fff" stroke="#dc2626"/>
  <text x="665" y="206" text-anchor="middle" font-size="16" font-family="monospace" fill="#7f1d1d">int gaji;</text>
  <text x="665" y="270" text-anchor="middle" font-size="12" fill="#991b1b">tidak bisa diakses langsung</text>
  <!-- arrows -->
  <path d="M200,175 L295,175" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <path d="M500,205 L590,205" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M200,245 L278,245" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 5" fill="none"/>
  <circle cx="279" cy="245" r="11" fill="#fff" stroke="#dc2626" stroke-width="2"/><path d="M274,240 L284,250 M284,240 L274,250" stroke="#dc2626" stroke-width="2"/>
  <text x="115" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">gaji = 5;  ditolak</text>
</svg>
