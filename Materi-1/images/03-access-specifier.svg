<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="400" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Siapa yang boleh mengakses member class?</text>
  <!-- class box -->
  <rect x="40" y="55" width="330" height="320" rx="12" fill="#f8fafc" stroke="#1e3a8a" stroke-width="2.5"/>
  <text x="205" y="82" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e3a8a">class Pekerja</text>
  <rect x="60" y="100" width="290" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="75" y="124" font-size="14" font-weight="bold" fill="#166534">public:</text>
  <text x="75" y="150" font-size="14" font-family="monospace" fill="#14532d">string nama;</text>
  <rect x="60" y="182" width="290" height="74" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="75" y="206" font-size="14" font-weight="bold" fill="#854d0e">protected:</text>
  <text x="75" y="232" font-size="14" font-family="monospace" fill="#713f12">int level;</text>
  <text x="75" y="246" font-size="12" fill="#92400e">(boleh dipakai class turunan)</text>
  <rect x="60" y="264" width="290" height="90" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="75" y="288" font-size="14" font-weight="bold" fill="#991b1b">private:</text>
  <text x="75" y="314" font-size="14" font-family="monospace" fill="#7f1d1d">int gaji;</text>
  <text x="75" y="338" font-size="12" fill="#991b1b">(hanya untuk class ini sendiri)</text>
  <!-- outside code -->
  <rect x="470" y="55" width="310" height="320" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="625" y="82" text-anchor="middle" font-size="17" font-weight="bold" fill="#334155">Kode di luar class (main)</text>
  <g font-size="14" font-family="monospace">
    <text x="490" y="140" fill="#14532d">p.nama = "Budi";</text>
    <text x="490" y="224" fill="#713f12">p.level = 2;</text>
    <text x="490" y="308" fill="#7f1d1d">p.gaji = 1000;</text></g>
  <g font-weight="bold" font-size="14">
    <text x="490" y="162" fill="#16a34a">OK: public</text>
    <text x="490" y="246" fill="#dc2626">ERROR: protected</text>
    <text x="490" y="330" fill="#dc2626">ERROR: private</text></g>
  <path d="M350,135 L475,135" stroke="#16a34a" stroke-width="3"/>
  <path d="M350,217 L475,217" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 5"/>
  <path d="M350,309 L475,309" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 5"/>
  <circle cx="445" cy="217" r="11" fill="#fff" stroke="#dc2626" stroke-width="2"/><path d="M440,212 L450,222 M450,212 L440,222" stroke="#dc2626" stroke-width="2"/>
  <circle cx="445" cy="309" r="11" fill="#fff" stroke="#dc2626" stroke-width="2"/><path d="M440,304 L450,314 M450,304 L440,314" stroke="#dc2626" stroke-width="2"/>
</svg>
