<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/></marker></defs>
  <rect width="820" height="400" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Polymorphism: satu perintah, hasil mengikuti object aslinya</text>
  <!-- loop code -->
  <rect x="270" y="50" width="280" height="62" rx="8" fill="#0f172a"/>
  <g font-size="14" font-family="monospace" fill="#e2e8f0">
    <text x="288" y="76">for (Animal* a : animals)</text>
    <text x="288" y="98">    a-&gt;sound();</text></g>
  <!-- arrows -->
  <path d="M340,114 L215,185" stroke="#1e3a8a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M480,114 L605,185" stroke="#1e3a8a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="250" y="140" font-size="13" fill="#475569" text-anchor="end">a = &amp;dog</text>
  <text x="570" y="140" font-size="13" fill="#475569">a = &amp;cat</text>
  <!-- dog -->
  <rect x="80" y="190" width="270" height="100" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="215" y="216" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a3412">Dog : public Animal</text>
  <line x1="80" y1="226" x2="350" y2="226" stroke="#ea580c"/>
  <text x="215" y="252" text-anchor="middle" font-size="14" font-family="monospace" fill="#431407">void sound() override</text>
  <text x="215" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">"The dog barks."</text>
  <!-- cat -->
  <rect x="470" y="190" width="270" height="100" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="605" y="216" text-anchor="middle" font-size="16" font-weight="bold" fill="#9d174d">Cat : public Animal</text>
  <line x1="470" y1="226" x2="740" y2="226" stroke="#db2777"/>
  <text x="605" y="252" text-anchor="middle" font-size="14" font-family="monospace" fill="#500724">void sound() override</text>
  <text x="605" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#9d174d">"The cat meows."</text>
  <!-- note -->
  <rect x="80" y="320" width="660" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="410" y="344" text-anchor="middle" font-size="14" fill="#1e3a8a">Pointer bertipe Animal*, tetapi karena sound() ditandai virtual,</text>
  <text x="410" y="364" text-anchor="middle" font-size="14" fill="#1e3a8a">C++ memilih versi sound() saat program berjalan (run time).</text>
</svg>
